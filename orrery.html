bh:[
"In 2019 the Event Horizon Telescope released the first-ever image of a black hole, the one in the galaxy M87, about 55 million light-years away.",
"In 2022 astronomers released an image of Sagittarius A*, the black hole at the centre of our own galaxy.",
"The event horizon is the boundary beyond which not even light can escape a black hole.",
"To become a black hole, Earth would have to be squeezed down to about 9 millimetres across.",
"General relativity predicts a singularity of infinite density at a black hole’s centre, which physicists expect new physics to replace.",

"The ‘no-hair theorem’ says a black hole can be described by just its mass, spin and electric charge.",
"Gas falling into a supermassive black hole can form a quasar, outshining all the stars in its galaxy.",
"The black hole TON 618 is estimated at tens of billions of times the Sun’s mass.",

"Primordial black holes, formed in the early universe, are hypothetical and have never been confirmed.",
"Some black holes spin at close to the speed of light, dragging space itself around with them.",
"Around a spinning black hole there is a region called the ergosphere where nothing can stand still, and in theory energy can be drawn out of it.",
"If the Sun were replaced by a black hole of the same mass, Earth would keep orbiting just as it does now.",
"The 2014 film Interstellar used equations from physicist Kip Thorne to render a scientifically informed black hole.",
"The term ‘black hole’ was popularised by physicist John Wheeler in 1967."

wh:[
"White holes come from the equations of general relativity: they are the time-reversed twin of a black hole.",
"In theory, matter and light can escape from a white hole, but nothing can ever enter it.",
"In the idealised mathematics, a black hole and a white hole can be linked by an Einstein–Rosen bridge, but it would pinch off too fast for anything to cross.",
"No white hole has ever been observed.",
"No known process in nature is able to form a white hole.",
"White holes seem to clash with the second law of thermodynamics, which is a major reason many physicists doubt they exist.",
"Physicists have argued that a white hole would be unstable and collapse into a black hole if even a little matter fell toward it.",
"In 2014, physicists Carlo Rovelli and Hal Haggard proposed that black holes might eventually ‘bounce’ into white holes through quantum gravity effects.",
"Some researchers have speculated that white holes might explain certain bursts of radio waves or gamma rays, but there is no evidence for this.",

"A white hole couldn’t be made from a collapsing star, so it would have had to exist since the beginning of the universe.",
"The picture you’re looking at is an artist’s illustration; nobody knows what a real white hole would look like.",
"A white hole’s boundary is a ‘past horizon’: you can leave it behind, but you can never reach it from outside.",
"In diagrams of the full mathematical solution, the white hole lies in the ‘past’ part of the spacetime, before the black hole.",
"When a real star collapses, the white-hole part of the mathematical solution never appears.",
"Roy Kerr’s equations for spinning black holes also contain white-hole regions in their mathematical extension.",
"Physicists mostly use white holes as thought experiments to test how general relativity and quantum theory fit together.",
"Physicist Nikodem Popławski has suggested our universe might have been born inside a black hole in another universe; this is speculative and not tested.",
"The laws of general relativity work the same forwards and backwards in time, but our universe clearly has an arrow of time, which makes white holes puzzling.",
"A white hole couldn’t grow by feeding on matter, since nothing can fall in; it could only lose mass.",
"Rovelli’s idea suggests tiny, long-lived white holes could be candidates for dark matter, though this is highly speculative.",
"No telescope has found anything matching a white hole’s predicted signature.",
"White holes are a popular idea in science fiction, often as the exit from a wormhole, but real physics gives no support for that.",
"Whether white holes are real or just a mathematical curiosity is still an open question."
